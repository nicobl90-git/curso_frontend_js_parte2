<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de contacto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../img/banner.jpg" alt="Banner de la página" width="150">
        <p>Bienvenido al Universo de los Seres</p>
    </header>
    <nav>
        <ul class="nav-list">
            <li><a href="../index.html">INICIO</a></li>
            <li><a href="./producto.html">PRODUCTOS</a></li>
            <li><a href="./contacto.html">CONTACTO</a></li>
        </ul>
    </nav>
    <main>
        <section class="titulo"> 
            <h1>CONTACTO</h1>
            <p>
                Bienvenido a la sección de contacto.
            </p>
        </section>

        <section class="titulo"> 
            <h2>FORMULARIO DE CONTACTO</h2>
            <p>
                Llene los campos del formulario para contactarnos.
            </p>
        </section>

        <section class="form-and-table">
            <form action="https://formspree.io/f/mnpqdnaw" method="POST">
                <fieldset class="input-form">
                    <legend>Datos de contacto</legend>

                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email">

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" cols="50"></textarea>

                    <button class="btn bg-primario" type="submit">Enviar</button>
                </fieldset>
            </form>
        </section>


    </main>
    <footer>
        <p>Síguenos en nuestras redes sociales:</p>
        <a href="https://web.whatsapp.com/"><i class="fa-brands fa-square-whatsapp"></i></a>
        <a href="https://www.instagram.com/nicolombardo_escritor/?hl=es-la"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.youtube.com/"><i class="fa-brands fa-youtube"></i></a>
    </footer>
</body>
</html>
